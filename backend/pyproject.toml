[project]
name = "documind"
version = "0.2.0"
description = "DocuMind AI: retrieval-augmented Q&A over your PDFs"
requires-python = ">=3.13"
# Kept deliberately lean: the API and worker ship as Lambda zip packages (250 MB unzipped limit),
# so no LangChain / ChromaDB. See docs/adr once written.
dependencies = [
    "boto3~=1.43",
    "fastapi~=0.141.1",
    "numpy~=2.5",
    "openai~=3.19",
    # Tracing: OpenTelemetry API/SDK, exported to AWS X-Ray (see documind.core.tracing).
    "opentelemetry-api~=1.45",
    "opentelemetry-sdk~=1.45",
    "opentelemetry-sdk-extension-aws~=2.1",
    "opentelemetry-propagator-aws-xray~=1.0",
    "opentelemetry-instrumentation-botocore==0.66b0",  # pre-1.0: pinned exactly
    "pydantic~=2.13",
    "pydantic-settings~=2.15",
    "pypdf~=6.19",
    "pyjwt[crypto]~=2.15",
    "tiktoken~=0.14.0",
]

[project.optional-dependencies]
loadtest = ["locust~=2.46"]
server = ["uvicorn[standard]~=0.53.0"]
demo = ["gradio~=6.28"]
dev = [
    "boto3-stubs[dynamodb,s3,sqs,ssm]",
    "httpx~=0.28.1",
    "moto[s3,sqs,dynamodb,ssm]~=5.2",
    "mypy~=2.3",
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "pytest-cov~=7.1",
    "ruff~=0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/documind"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["documind"]
branch = true

[tool.coverage.report]
# CI fails if coverage drops below this (currently ~93%).
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
