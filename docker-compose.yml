# Local stack that mirrors the AWS architecture at zero cost:
#   api (FastAPI) ──► DynamoDB Local
#        │  └──────► moto (S3 + SQS emulation) ◄── worker (ingestion)
# LocalStack is not used: since March 2026 it requires an account/auth token.
# MinIO is not used: its Docker images were withdrawn in September 2026.
#
#   docker compose up --build     → API on http://localhost:8000/docs

x-backend-env: &backend-env
  DOCUMIND_BACKEND: aws
  DOCUMIND_DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
  DOCUMIND_S3_ENDPOINT_URL: http://moto:5000
  # Presigned upload URLs are opened by the browser on the host, not inside the network.
  DOCUMIND_S3_PUBLIC_ENDPOINT_URL: http://localhost:5000
  DOCUMIND_SQS_ENDPOINT_URL: http://moto:5000
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  AWS_DEFAULT_REGION: us-east-1

x-backend: &backend
  build: ./backend
  env_file:
    - path: ./backend/.env
      required: false
  environment: *backend-env
  volumes:
    - ./backend/src:/app/src
  depends_on:
    bootstrap:
      condition: service_completed_successfully

services:
  dynamodb:
    image: amazon/dynamodb-local:3.1.0
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["8001:8000"]

  moto:
    image: motoserver/moto:5.2.3
    ports: ["5000:5000"]

  bootstrap:
    build: ./backend
    environment: *backend-env
    command: ["python", "-m", "documind.scripts.bootstrap_local"]
    depends_on: [dynamodb, moto]

  api:
    <<: *backend
    command: ["uvicorn", "documind.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: ["python", "-m", "documind.worker"]
