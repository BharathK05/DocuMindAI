# Continuous integration: every pull request (and every push to main/upgrade) must pass
# lint, type-check, tests, the web app's checks and a Lambda package build before merging.
name: CI

on:
  pull_request:
  push:
    branches: [main, upgrade]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

defaults:
  run:
    working-directory: backend

env:
  PYTHON_VERSION: "3.13"  # must match the Lambda runtime

jobs:
  quality:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[server,dev]"
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy src evals tests scripts

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[server,dev]"
      # No OpenAI key and no AWS account needed: LLM calls use a fake provider and AWS is
      # emulated in-process by moto. Fails if coverage drops below the gate in pyproject.toml.
      - name: Pytest with coverage
        run: pytest -q --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: backend/coverage.xml
          retention-days: 7

  terraform:
    name: Terraform fmt, validate, tflint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
      - run: terraform fmt -check -recursive
      - name: Validate every root module (no AWS access needed)
        run: |
          for dir in account envs/dev envs/prod; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - run: tflint --init --config "$PWD/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}  # avoids API rate limits when fetching the plugin
      - run: tflint --recursive --config "$PWD/.tflint.hcl"

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # scan every commit, not just the latest, for leaked secrets
      - name: Secret scan (gitleaks, full history)
        working-directory: .
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --redact --no-banner
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[server,dev]" "pip-audit~=2.10"
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit --skip-editable --progress-spinner off

  frontend:
    name: Web app (lint, types, tests, build, Lighthouse)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Build (also refreshes the landing page's eval numbers)
        run: npm run build
      - name: Eval numbers on the landing page match the committed results file
        run: git diff --exit-code src/data/eval.json
      - name: Dependency vulnerability scan (npm audit, production deps)
        run: npm audit --omit=dev --audit-level=high
      - name: Lighthouse (performance and accessibility must score 90+)
        run: npx --yes @lhci/cli@0.15.1 autorun

  build-lambda:
    name: Build Lambda packages
    needs: [quality, test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install tiktoken~=0.14.0  # only needed to pre-fetch tokenizer files
      # The runner is x86_64, so it can run the x86_64 package inside AWS's Lambda image.
      - name: Build x86_64 package
        run: python scripts/build_lambda.py --arch x86_64
      - name: Smoke-test inside the official Lambda image (network disabled)
        run: bash scripts/lambda_smoke.sh x86_64
      # arm64 (Graviton) is what gets deployed: same code, ARM wheels.
      - name: Build arm64 package
        run: python scripts/build_lambda.py --arch arm64
      - uses: actions/upload-artifact@v7
        with:
          name: lambda-packages
          path: |
            backend/dist/layer-arm64.zip
            backend/dist/function.zip
          retention-days: 7
